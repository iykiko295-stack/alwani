<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ألواني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@500;700&family=Playpen+Sans:wght@500;700&display=swap">
<style>
/* ألواني: the colouring sister of حروفي, same paper notebook look.
   Hub = the palette badge in the middle with the four sections around it on dotted lines.
   Shelf = pastel tiles of pictures. Paint = a square white page beside a tool panel (below it when upright).
   Deliberately light-only: it is paper. */
:root{
  --ground:#F2F6FA; --paper:#FFFFFF; --ink:#1D3146; --ink-soft:#5E7286; --track:#E0E7EF; --guide:#98AABD;
  --gold:#FFB400; --line:#E4EAF1; --danger:#C2362F; --scrim:rgba(29,49,70,.34);
  --shadow:0 1px 2px rgba(29,49,70,.06),0 10px 26px rgba(29,49,70,.08);
  --font-ui:"Baloo Bhaijaan 2","Geeza Pro","SF Arabic","Noto Sans Arabic",Tahoma,sans-serif;
  --font-book:"Noto Naskh Arabic","Geeza Pro","Times New Roman",serif;
  --font-latin:"Playpen Sans","Baloo Bhaijaan 2","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
  --lc:#F0524B; --lt:#FFE6E4; --cur:#FFD23F;
  color-scheme:light;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;background:var(--ground);color:var(--ink);font-family:var(--font-ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--lc);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
svg{display:block}
.grow{flex:1}
.lt{font-family:var(--font-latin)}

.btn{height:56px;min-width:56px;border:0;border-radius:18px;background:var(--paper);box-shadow:var(--shadow);flex:none;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;font-weight:700;font-size:18px;color:var(--ink)}
.btn.icon{padding:0}
.btn.primary{background:var(--lc);color:#fff}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:52px;padding:0 16px;border-radius:16px;background:var(--paper);box-shadow:var(--shadow);
  font-weight:700;font-size:19px;color:var(--ink);flex:none;font-variant-numeric:tabular-nums}
.chip svg{width:24px;height:24px;fill:none;stroke:var(--lc);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- hub ---------- */
.hub-top{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:16px 24px 0;max-width:1220px;width:100%;margin-inline:auto}
.hub-brand{display:none;margin:0 0 0 auto;font-size:30px;line-height:1;font-weight:800;letter-spacing:0}
.hub{flex:1;min-height:0;position:relative;display:grid;gap:26px 34px;padding:6px 28px 26px;max-width:1260px;width:100%;margin-inline:auto;
  grid-template-columns:minmax(0,1fr) minmax(170px,.56fr) minmax(0,1fr);grid-template-rows:repeat(2,minmax(0,1fr));
  grid-template-areas:"o0 badge o1" "o2 badge o3"}
#hubLines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.cn{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:.01 13}
.cn-tip{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.badge{grid-area:badge;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:0}
.disc{width:clamp(96px,16vh,170px);aspect-ratio:1;flex:none;border-radius:50%;background:var(--paper);display:grid;place-items:center;
  box-shadow:0 2px 4px rgba(29,49,70,.06),0 16px 40px rgba(29,49,70,.12)}
.disc svg{width:74%;height:74%}
.badge h1{margin:6px 0 0;font-size:clamp(26px,4.2vh,46px);line-height:1;font-weight:800;letter-spacing:0}
.opt{position:relative;z-index:1;min-height:0;min-width:0;border:0;border-radius:32px;background:var(--t);color:var(--c);
  display:flex;flex-direction:column;gap:6px;padding:14px 20px 16px;box-shadow:inset 0 -6px 0 rgba(29,49,70,.06);text-align:start}
.opt:active{transform:scale(.97)}
.opt .pv{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-block:4px}
.opt .pv svg{height:100%;max-height:230px;width:auto;max-width:100%}
.opt .lab{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.opt .lab b{display:block;font-size:clamp(22px,3.3vh,32px);line-height:1.1;font-weight:800;color:var(--ink)}
.opt .lab span{font-size:15px;font-weight:600;color:var(--ink-soft)}
.got{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:17px;color:var(--ink);background:rgba(255,255,255,.72);
  border-radius:12px;padding:3px 10px 1px;font-variant-numeric:tabular-nums;flex:none}
.got:empty{display:none}

/* ---------- shelf ---------- */
.cat-top{display:flex;align-items:center;gap:12px;padding:16px 24px 8px;max-width:1160px;width:100%;margin-inline:auto}
.ctitle{display:flex;align-items:center;gap:12px;min-width:0}
.ctitle .ci{width:56px;height:56px;border-radius:18px;background:var(--t);color:var(--c);display:grid;place-items:center;flex:none;overflow:hidden}
.ctitle .ci svg{width:84%;height:84%}
.ctitle h1{margin:0;font-size:30px;line-height:1.05;font-weight:800;letter-spacing:0}
.ctitle span{font-size:15px;color:var(--ink-soft);font-weight:600}
.groups{display:flex;gap:4px;background:var(--paper);box-shadow:var(--shadow);border-radius:20px;padding:5px;flex:none;overflow-x:auto;max-width:100%;scrollbar-width:none}
.groups::-webkit-scrollbar{display:none}
.groups button{border:0;border-radius:15px;background:transparent;height:48px;padding:0 14px;font-weight:700;font-size:18px;color:var(--ink-soft);
  display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.groups button svg{width:26px;height:26px;flex:none}
.groups button[aria-pressed="true"]{background:var(--t);color:var(--c)}
.groups button[aria-pressed="true"] span{color:var(--ink)}
.shelf{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 24px 28px}
.tiles{--cols:6;--gap:16px;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:var(--gap);max-width:1112px;width:100%;margin:0 auto}
.tiles[data-g="scenes"]{--cols:4}
.tiles[data-g="letters"],.tiles[data-g="abc"]{--cols:7}
.tiles[data-g="numbers"]{--cols:5}
.tiles[data-g="number"],.tiles[data-g="draw"]{--cols:6}
.tile{position:relative;aspect-ratio:1/1.12;min-width:0;border:0;border-radius:26px;background:var(--t);color:var(--c);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 8px 10px;
  box-shadow:inset 0 -5px 0 rgba(29,49,70,.05);transition:transform .15s ease}
.tile:active{transform:scale(.94)}
.tile .tv{width:88%;flex:1;min-height:0;display:grid;place-items:center}
.tile .tv svg{width:100%;height:100%}
.tile .nm{font-size:clamp(14px,1.55vw,19px);font-weight:700;line-height:1.15;color:var(--ink)}
.tile .nm.lt{font-weight:500}
.tile .sm{font-size:14px;font-weight:600;color:var(--ink-soft);line-height:1.1}
.tile .mine{position:absolute;top:8px;inset-inline-end:8px;width:30%;aspect-ratio:1;border-radius:12px;border:3px solid var(--paper);
  box-shadow:0 3px 10px rgba(29,49,70,.18);background:var(--paper) center/cover no-repeat}
.tile .dots{display:flex;gap:4px;justify-content:center}
.tile .dots i{width:12px;height:12px;border-radius:50%;background:var(--s);box-shadow:inset 0 0 0 1.5px rgba(29,49,70,.12)}
.tv .ln{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
.tv .dt{fill:var(--ink)}

/* ---------- paint ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:14px 20px 10px}
.title{display:flex;align-items:center;gap:12px;min-width:0}
.title .gl{width:56px;height:56px;border-radius:18px;background:var(--lt);color:var(--lc);display:grid;place-items:center;flex:none}
.title .gl svg{width:84%;height:84%}
.title .tx{display:flex;flex-direction:column;min-width:0}
.title b{font-size:26px;line-height:1.35;margin-top:-4px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span{font-size:15px;color:var(--ink-soft);font-weight:600}
.group{display:flex;gap:10px}
.desk{flex:1;min-height:0;display:flex;gap:18px;padding:4px 20px 20px;justify-content:center}
.page{position:relative;flex:none;height:100%;aspect-ratio:1/1;max-width:calc(100% - 318px);background:var(--paper);border-radius:34px;
  box-shadow:var(--shadow);overflow:hidden;container-type:size}
#art{position:absolute;inset:0;margin:auto;width:100%;height:100%;width:min(100cqw,100cqh);height:min(100cqw,100cqh);touch-action:none;direction:ltr}
#art>*{position:absolute;inset:0;width:100%;height:100%}
#cvLive.water{opacity:.62;mix-blend-mode:multiply}
#cvLive.erase{opacity:0}
#lines,#marks,#lids,#cvFx{pointer-events:none}
#lines .ln{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
#lines .dt{fill:var(--ink)}
#lines .gl{fill:#fff}
.badge-n circle{fill:var(--paper);stroke-width:2.6}
.badge-n text{font-family:var(--font-ui);font-weight:800;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.badge-n{transform-box:fill-box;transform-origin:center;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .3s}
.badge-n.done{transform:scale(0);opacity:0}
.badge-n.no{animation:shake .4s ease}
.gd{fill:none;stroke:var(--guide);stroke-width:3.6;stroke-linecap:round;stroke-dasharray:.01 9.5}
.gd-dot{fill:none;stroke:var(--guide);stroke-width:3;stroke-dasharray:.01 6.4;stroke-linecap:round}
.demo-ln{fill:none;stroke:var(--lc);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.5}
.pen{fill:var(--paper);stroke:var(--lc);stroke-width:4.5}
.ink{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.ink-dot{fill:var(--ink)}
.hint{position:absolute;top:14px;inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);z-index:3;
  padding:7px 18px 5px;border-radius:999px;background:var(--lt);color:var(--lc);font-weight:700;font-size:19px;line-height:1.3;pointer-events:none;text-align:center}
.hint:empty{display:none}
.hint.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.side{flex:1;min-width:0;max-width:430px;display:flex;flex-direction:column;gap:14px;min-height:0;overflow-y:auto;padding:2px}
.card{background:var(--paper);border-radius:24px;box-shadow:var(--shadow);padding:14px 16px 16px;min-width:0}
.card h2{margin:0 0 10px;font-size:15px;font-weight:700;color:var(--ink-soft);letter-spacing:0}
.toolset{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tool{border:0;border-radius:18px;background:var(--ground);aspect-ratio:1.45/1;display:grid;place-items:center;padding:4px;min-width:0}
.tool svg{width:82%;height:82%;overflow:visible}
.tool[aria-pressed="true"]{background:var(--lt);box-shadow:inset 0 0 0 3px var(--lc)}
.tool:active{transform:scale(.94)}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.size{border:0;border-radius:16px;background:var(--ground);height:50px;display:grid;place-items:center}
.size i{display:block;border-radius:50%;background:var(--cur);box-shadow:inset 0 0 0 1.5px rgba(29,49,70,.15)}
.size[aria-pressed="true"]{background:var(--lt);box-shadow:inset 0 0 0 3px var(--lc)}
.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;justify-items:center}
.sw{position:relative;border:0;aspect-ratio:1;width:100%;max-width:72px;border-radius:50%;background:var(--s);padding:0;min-width:0;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.13);transition:transform .15s ease}
.sw.white{box-shadow:inset 0 0 0 2px var(--line),inset 0 -5px 0 rgba(0,0,0,.06)}
.sw[aria-pressed="true"]{transform:scale(1.06);box-shadow:0 0 0 4px var(--paper),0 0 0 7.5px var(--ink)}
.sw:active{transform:scale(.92)}
.sw b{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(22px,2.6vw,34px);font-weight:800;line-height:1;padding-top:3px}
.swatches.nums{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.swatches.nums .sw{max-width:96px}
.sw.flash{animation:flash 1s ease 2}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(255,180,0,0)}50%{box-shadow:0 0 0 9px rgba(255,180,0,.85)}}
.prog{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.prog .bar2{flex:1;height:12px;border-radius:6px;background:var(--ground);overflow:hidden}
.prog .bar2 i{display:block;height:100%;width:0;background:var(--lc);border-radius:6px;transition:width .4s ease}
.stepcard{display:flex;flex-direction:column;gap:14px}
.stepcard .st-n{display:flex;align-items:center;gap:12px}
.stepcard .st-n b{width:58px;height:58px;border-radius:18px;background:var(--lt);color:var(--lc);display:grid;place-items:center;font-size:34px;font-weight:800;flex:none;padding-top:4px}
.stepcard .st-n span{font-size:24px;font-weight:800;line-height:1.25}
.pipsrow{display:flex;gap:8px}
.pipsrow i{flex:1;height:10px;border-radius:5px;background:var(--ground)}
.pipsrow i.on{background:var(--lc)}
.stepacts{display:flex;gap:10px;flex-wrap:wrap}
.stepacts .btn{flex:1}
.stepmini{display:grid;place-items:center;background:var(--ground);border-radius:18px;padding:10px}
.stepmini svg{width:min(100%,190px);height:auto;aspect-ratio:1}
.stepmini .ln{fill:none;stroke:var(--guide);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.stepmini .ln.now{stroke:var(--lc)}
.stepmini .dt{fill:var(--guide)}.stepmini .dt.now{fill:var(--lc)}

/* win sheet */
.win{position:absolute;inset-inline:16px;bottom:16px;z-index:4;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 16px;border-radius:26px;background:var(--paper);box-shadow:0 12px 40px rgba(29,49,70,.18);
  transform:translateY(140%);transition:transform .45s cubic-bezier(.34,1.4,.64,1)}
.win.show{transform:translateY(0)}
.win .msg{flex:1;min-width:160px}
.win .msg b{display:block;font-size:30px;line-height:1.1;font-weight:800;color:var(--lc)}
.win .msg span{font-size:16px;color:var(--ink-soft);font-weight:600}
.win .acts{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- gallery ---------- */
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:20px;max-width:1112px;margin:0 auto}
.frame{border:0;background:var(--paper);border-radius:24px;padding:10px 10px 8px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0;
  transition:transform .15s ease}
.frame:active{transform:scale(.96)}
.frame img{width:100%;aspect-ratio:1;border-radius:16px;display:block;object-fit:cover;background:var(--ground);box-shadow:inset 0 0 0 1px var(--line)}
.frame .nm{font-weight:700;font-size:17px;line-height:1.2;display:flex;justify-content:space-between;gap:6px;padding-inline:4px}
.frame .nm small{color:var(--ink-soft);font-weight:600;font-size:14px}
.empty{max-width:520px;margin:6vh auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty svg{width:200px;height:auto}
.empty b{font-size:26px;font-weight:800}
.empty p{margin:0;color:var(--ink-soft);font-weight:600;font-size:17px;line-height:1.45}
.note{max-width:1112px;margin:0 auto 14px;padding:10px 16px;border-radius:16px;background:var(--paper);color:var(--ink-soft);font-weight:600;font-size:15px;
  display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
.note svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--ink-soft);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* viewer */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);display:grid;place-items:center;padding:16px}
.vsheet{width:min(760px,100%);max-height:100%;overflow-y:auto;background:var(--paper);border-radius:32px;padding:16px;box-shadow:0 20px 60px rgba(29,49,70,.25);
  display:flex;flex-direction:column;gap:12px}
.vhead{display:flex;align-items:center;gap:12px}
.vhead h2{margin:0;font-size:26px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vhead span{color:var(--ink-soft);font-size:15px;font-weight:600}
.vpic{position:relative;width:min(100%,calc(100vh - 300px));width:min(100%,calc(100dvh - 300px));min-width:min(100%,260px);aspect-ratio:1;margin:0 auto;border-radius:22px;overflow:hidden;background:var(--ground)}
.vpic img{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-touch-callout:default}
.vpic svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.vacts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.vacts .btn{flex:1 1 150px}
.vconfirm{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:center;padding:12px;border-radius:20px;background:#FDECEA}
.vconfirm b{font-size:18px;color:var(--danger)}
.btn.danger{color:var(--danger)}
.btn.danger.fill{background:var(--danger);color:#fff}
.vtip{margin:0;text-align:center;color:var(--ink-soft);font-weight:600;font-size:15px}

/* settings */
.sheet{width:min(580px,100%);max-height:100%;overflow-y:auto;background:var(--paper);border-radius:30px;padding:20px 22px 16px;box-shadow:0 20px 60px rgba(29,49,70,.25)}
.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.sheet-head h2{margin:0;font-size:28px;font-weight:800;flex:1;letter-spacing:0}
.set-row{display:grid;gap:8px;padding-block:14px;border-top:1.5px solid var(--line)}
.set-row h3{margin:0;font-size:20px;line-height:1.2;font-weight:800}
.set-row p{margin:0;color:var(--ink-soft);font-size:15px;font-weight:600;line-height:1.35}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--ground);border-radius:18px;padding:5px}
.seg button{border:0;border-radius:14px;background:transparent;min-height:54px;font-weight:700;font-size:17px;line-height:1.2;padding:6px 10px;
  display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-soft)}
.seg button svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(29,49,70,.08),0 4px 14px rgba(29,49,70,.1)}
.seg button[aria-pressed="true"] svg{stroke:#F0524B}
.set-foot{padding-top:12px;border-top:1.5px solid var(--line);color:var(--ink-soft);font-weight:600;font-size:15px;line-height:1.4;text-align:center}

.toast{position:fixed;left:0;right:0;bottom:22px;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);z-index:40;
  padding:10px 20px 8px;border-radius:18px;background:var(--ink);color:#fff;font-weight:700;font-size:17px;line-height:1.35;text-align:center;
  box-shadow:0 10px 30px rgba(29,49,70,.25);transition:opacity .3s,transform .3s}
.toast[hidden]{display:block!important;opacity:0;transform:translateY(20px);pointer-events:none}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}

/* no animations: everything still works, nothing moves on its own */
.calm *,.calm *::before,.calm *::after{animation:none!important;transition:none!important}

/* portrait (iPad upright, phones) */
@media (max-aspect-ratio:1/1){
  .hub{gap:22px 22px;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);
    grid-template-areas:"o0 o1" "badge badge" "o2 o3"}
  .disc{width:clamp(96px,13vh,150px)}
  #hubLines{display:none}
  .badge{flex-direction:row;gap:16px}
  .badge h1{margin:0}
  .opt .lab{flex-direction:column;align-items:flex-start;gap:6px}
  .tiles{--cols:4}
  .tiles[data-g="scenes"]{--cols:3}
  .tiles[data-g="number"],.tiles[data-g="draw"]{--cols:4}
  .tiles[data-g="letters"],.tiles[data-g="abc"]{--cols:5}
  .tiles[data-g="numbers"]{--cols:4}
  .desk{flex-direction:column;align-items:center}
  .page{height:auto;width:min(100%,calc(100vh - 420px));width:min(100%,calc(100dvh - 420px));max-width:none}
  .side{flex:none;width:100%;max-width:none;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;overflow:visible}
  .side .card{padding:12px 14px 14px}
  .c-tools{grid-column:1}
  .c-sizes{grid-column:2}
  .c-colours{grid-column:1/-1}
  .toolset{grid-template-columns:repeat(6,minmax(0,1fr))}
  .tool{aspect-ratio:1/1}
  .sizes{grid-template-columns:repeat(3,56px)}
  .size{height:auto;aspect-ratio:1}
  .swatches{grid-template-columns:repeat(8,minmax(0,1fr))}
  .swatches.nums{grid-template-columns:repeat(6,minmax(0,1fr))}
  .c-step{grid-column:1/-1}
  .stepcard{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px 16px}
  .stepcard .stepmini{grid-row:1/4;grid-column:2;padding:8px}
  .stepmini svg{width:120px}
  .c-number{grid-column:1/-1}
}
@media (max-width:900px){
  .bar{gap:8px;padding:12px 14px 8px}
  .group{gap:8px}
  .desk{padding:4px 14px 14px;gap:12px}
}
@media (max-width:760px){
  .bar .btn .lbl{display:none}
  .bar .btn{padding:0;width:52px;height:52px;min-width:52px}
}
@media (max-width:640px){
  .hub-top{padding:12px 16px 0}
  .hub-brand{display:block}
  .hub{padding:8px 16px 16px;gap:12px;grid-template-rows:repeat(2,minmax(0,1fr));grid-template-areas:"o0 o1" "o2 o3"}
  .badge,#hubLines{display:none}
  .opt{border-radius:24px;padding:12px 12px 12px}
  .opt .lab span{font-size:14px}
  .cat-top{flex-wrap:wrap;row-gap:10px;padding:12px 16px 6px}
  .cat-top .grow{display:none}
  .ctitle{flex:1;min-width:0}
  .ctitle h1{font-size:24px}
  .ctitle .ci{width:46px;height:46px;border-radius:14px}
  .groups{order:9;flex-basis:100%}
  .groups button{height:44px;font-size:16px;padding:0 10px}
  .groups button span{display:none}
  .groups button.lt span,.groups button[aria-pressed="true"] span{display:inline}
  .shelf{padding:8px 16px 20px}
  .tiles{--gap:10px;--cols:3}
  .tiles[data-g="scenes"]{--cols:2}
  .tiles[data-g="number"],.tiles[data-g="draw"]{--cols:3}
  .tiles[data-g="letters"],.tiles[data-g="abc"],.tiles[data-g="numbers"]{--cols:4}
  .tile{border-radius:20px}
  .chip{height:46px;font-size:17px;padding:0 12px}
  .title .gl{width:48px;height:48px}
  .title .tx{display:none}
  .bar .btn{width:44px;height:44px;min-width:44px;border-radius:14px}
  .bar .btn svg{width:22px;height:22px}
  .desk{overflow-y:auto;justify-content:flex-start}
  .page{width:100%;border-radius:26px}
  .side{gap:10px;grid-template-columns:minmax(0,1fr)}
  .c-tools,.c-sizes,.c-colours{grid-column:1}
  .sizes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .size{aspect-ratio:auto;height:46px}
  .tool{aspect-ratio:1.15/1}
  .card{border-radius:20px}
  .swatches{gap:6px}
  .toolset{gap:6px}
  .tool{border-radius:14px}
  .win .btn{height:48px;font-size:16px}
  .win .msg b{font-size:24px}
  .frames{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .sheet{padding:16px 16px 12px;border-radius:24px}
  .seg button{font-size:15px;min-height:50px}
  .stepcard .st-n span{font-size:20px}
  .stepmini svg{width:96px}
}
@media (prefers-reduced-motion:reduce){
  .hint.pop,.badge-n.no{animation:none}
  .win,.badge-n{transition:none}
}

<script>
/* ألواني colouring engine: line art -> walls -> regions, and the paint operations on top of it.
   Picture space is 400 x 400 units; every canvas works at RES x RES pixels. */
const ENG = (() => {
  'use strict';
  const RES = 1200, U = RES / 400;                 // pixels per unit
  const LW = 5;                                    // printed line width, units
  const INK = '#1D3146';

  function canvas(w, h) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; return c;
  }
  const PATHS = new Map();
  const p2d = d => { let p = PATHS.get(d); if (!p) { p = new Path2D(d); PATHS.set(d, p); } return p; };

  /* Draw a picture's lines. extra = units added to every width (to close small gaps for the wall map).
     walls: also draw the invisible gap closers added to a child's own drawing. */
  function drawLines(ctx, pic, extra, color, scale, walls) {
    const k = scale || U;
    ctx.save();
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = color; ctx.fillStyle = color;
    for (const el of pic.lines || []) {
      if (el.hid && !walls) continue;
      if (el.d) { ctx.lineWidth = (el.w || LW) + extra; ctx.stroke(p2d(el.d)); }
      else if (el.c) { ctx.beginPath(); ctx.arc(el.c[0], el.c[1], el.c[2] + extra / 2, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.restore();
    if (pic.bub) drawBubble(ctx, pic.bub, extra, color, k);
  }
  /* Bubble letters: the outline of the union of thick strokes and round dots. */
  function drawBubble(ctx, b, extra, color, k) {
    const w = Math.ceil(400 * k), t = canvas(w, w), c = t.getContext('2d');
    c.setTransform(k, 0, 0, k, 0, 0);
    c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#000'; c.fillStyle = '#000';
    const half = (LW + extra) / 2;
    for (const s of b.paths) { c.lineWidth = s.w + 2 * half; c.stroke(p2d(s.d)); }
    for (const [x, y, r] of b.dots) { c.beginPath(); c.arc(x, y, r + half, 0, Math.PI * 2); c.fill(); }
    c.globalCompositeOperation = 'destination-out';           // opaque erase: the inside is fully cleared
    for (const s of b.paths) { c.lineWidth = Math.max(1, s.w - 2 * half); c.stroke(p2d(s.d)); }
    for (const [x, y, r] of b.dots) { c.beginPath(); c.arc(x, y, Math.max(.5, r - half), 0, Math.PI * 2); c.fill(); }
    c.globalCompositeOperation = 'source-in'; c.fillStyle = color; c.fillRect(0, 0, 400, 400);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(t, 0, 0); ctx.restore();
    t.width = t.height = 0;                                   // Safari frees canvas memory late; let it go now
  }

  /* Wall map and regions. Every pixel ends up owned by one region: the open space it belongs to,
     or for a pixel under a line, the nearest open space. Filling a region paints its owned pixels,
     so colour always reaches under the printed line and no white rim is left. */
  function regions(pic, close) {
    const wc = canvas(RES, RES), wctx = wc.getContext('2d', { willReadFrequently: true });
    drawLines(wctx, pic, 2 * close, '#000', U, true);
    const px = wctx.getImageData(0, 0, RES, RES).data, N = RES * RES;
    wc.width = wc.height = 0;
    const wall = new Uint8Array(N);
    for (let i = 0; i < N; i++) wall[i] = px[i * 4 + 3] > 96 ? 1 : 0;
    const lab = new Int32Array(N), stack = new Int32Array(N);
    const area = [0], box = [null];
    let n = 0;
    for (let s = 0; s < N; s++) {
      if (wall[s] || lab[s]) continue;
      n++; let sp = 0, a = 0, x0 = RES, y0 = RES, x1 = 0, y1 = 0;
      stack[sp++] = s; lab[s] = n;
      while (sp) {
        const p = stack[--sp], x = p % RES, y = (p - x) / RES; a++;
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        if (x > 0 && !wall[p - 1] && !lab[p - 1]) { lab[p - 1] = n; stack[sp++] = p - 1; }
        if (x < RES - 1 && !wall[p + 1] && !lab[p + 1]) { lab[p + 1] = n; stack[sp++] = p + 1; }
        if (y > 0 && !wall[p - RES] && !lab[p - RES]) { lab[p - RES] = n; stack[sp++] = p - RES; }
        if (y < RES - 1 && !wall[p + RES] && !lab[p + RES]) { lab[p + RES] = n; stack[sp++] = p + RES; }
      }
      area.push(a); box.push([x0, y0, x1, y1]);
    }
    // specks of a few pixels caught between lines join the lines, so a neighbour's fill covers them
    const MINA = 60, keep = new Int32Array(n + 1), area2 = [0], box2 = [null];
    let m = 0;
    for (let l = 1; l <= n; l++) if (area[l] >= MINA) { keep[l] = ++m; area2.push(area[l]); box2.push(box[l]); }
    if (m < n) for (let p = 0; p < N; p++) { const l = lab[p]; if (l) { const k = keep[l]; if (!k) { wall[p] = 1; lab[p] = 0; } else lab[p] = k; } }
    n = m; area.length = 0; area.push(...area2); box.length = 0; box.push(...box2);
    // nearest-region owner for line pixels (breadth-first from every region edge)
    const own = lab; let qh = 0, qt = 0; const q = stack;
    for (let p = 0; p < N; p++) {
      if (!wall[p]) continue;
      const x = p % RES;
      const l = (x > 0 && lab[p - 1] && !wall[p - 1]) ? lab[p - 1] : (x < RES - 1 && lab[p + 1] && !wall[p + 1]) ? lab[p + 1]
        : (p >= RES && lab[p - RES] && !wall[p - RES]) ? lab[p - RES] : (p < N - RES && lab[p + RES] && !wall[p + RES]) ? lab[p + RES] : 0;
      if (l) { own[p] = -l; q[qt++] = p; }          // negative = claimed this layer, fixed below
    }
    for (let i = 0; i < qt; i++) own[q[i]] = -own[q[i]];
    while (qh < qt) {
      const p = q[qh++], l = own[p], x = p % RES;
      if (x > 0 && wall[p - 1] && !own[p - 1]) { own[p - 1] = l; q[qt++] = p - 1; }
      if (x < RES - 1 && wall[p + 1] && !own[p + 1]) { own[p + 1] = l; q[qt++] = p + 1; }
      if (p >= RES && wall[p - RES] && !own[p - RES]) { own[p - RES] = l; q[qt++] = p - RES; }
      if (p < N - RES && wall[p + RES] && !own[p + RES]) { own[p + RES] = l; q[qt++] = p + RES; }
    }
    // owned boxes (open space plus the line pixels each region claimed)
    const obox = box.map(b => b && b.slice());
    for (let p = 0; p < N; p++) {
      if (!wall[p]) continue;
      const l = own[p]; if (!l) continue;
      const x = p % RES, y = (p - x) / RES, b = obox[l];
      if (x < b[0]) b[0] = x; if (x > b[2]) b[2] = x; if (y < b[1]) b[1] = y; if (y > b[3]) b[3] = y;
    }
    return { n, own, wall, area, box: obox, inner: box };
  }

  /* Distance from a point (pixels) to the nearest line pixel, searched on rings up to maxR. */
  function clearance(R, x, y, maxR) {
    const xi = Math.round(x), yi = Math.round(y);
    for (let r = 1; r <= maxR; r++) {
      const steps = Math.max(8, Math.round(r * 6.3));
      for (let k = 0; k < steps; k++) {
        const a = k / steps * Math.PI * 2, px = Math.round(xi + r * Math.cos(a)), py = Math.round(yi + r * Math.sin(a));
        if (px < 0 || py < 0 || px >= RES || py >= RES) return r;
        if (R.wall[py * RES + px]) return r;
      }
    }
    return maxR;
  }

  /* A region's pixels as an alpha mask the size of its box. */
  function regionMask(R, l) {
    const b = R.box[l], w = b[2] - b[0] + 1, h = b[3] - b[1] + 1;
    const c = canvas(w, h), ctx = c.getContext('2d'), im = ctx.createImageData(w, h), d = im.data;
    for (let y = 0; y < h; y++) {
      let p = (b[1] + y) * RES + b[0], o = y * w * 4;
      for (let x = 0; x < w; x++, p++, o += 4) if (R.own[p] === l) { d[o + 3] = 255; }
    }
    ctx.putImageData(im, 0, 0);
    return { c, x: b[0], y: b[1], w, h };
  }

  /* A filled region as an image the size of its box. colorAt(x, y) for rainbow fills. */
  function regionFill(R, l, rgb, colorAt) {
    const b = R.box[l], w = b[2] - b[0] + 1, h = b[3] - b[1] + 1;
    const c = canvas(w, h), ctx = c.getContext('2d'), im = ctx.createImageData(w, h), d = im.data;
    for (let y = 0; y < h; y++) {
      let p = (b[1] + y) * RES + b[0], o = y * w * 4;
      for (let x = 0; x < w; x++, p++, o += 4) {
        if (R.own[p] !== l) continue;
        const col = colorAt ? colorAt(b[0] + x, b[1] + y) : rgb;
        d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255;
      }
    }
    ctx.putImageData(im, 0, 0);
    return { c, x: b[0], y: b[1], w, h };
  }

  return { RES, U, LW, INK, canvas, drawLines, regions, clearance, regionMask, regionFill, p2d };
})();

(() => {

const pick = a => a[(Math.random() * a.length) | 0];
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const ar = n => String(n).replace(/\d/g, d => AR_DIGITS[d]);

/* ---------------- sound: small synthesized notes, no files ---------------- */
const Sound = {
  ctx: null,
  unlock() {
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },
  tone(f, dur, o = {}) {
    if (!store.sound || !this.ctx) return;
    try {
      const t = this.ctx.currentTime + (o.when || 0);
      const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.gain || 0.1, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(this.ctx.destination);
      osc.start(t); osc.stop(t + dur + 0.03);
    } catch (e) {}
  },
  fill() { this.tone(392, 0.16, { gain: 0.09, slide: 784 }); this.tone(1046.5, 0.14, { gain: 0.05, when: 0.08, type: 'triangle' }); },
  sparkle() { this.tone(1900 + Math.random() * 1500, 0.07, { gain: 0.022 }); },
  tap() { this.tone(660, 0.07, { gain: 0.05, type: 'triangle' }); },
  step() { this.tone(783.99, 0.2, { gain: 0.09 }); this.tone(1174.66, 0.32, { gain: 0.08, when: 0.09 }); },
  miss() { this.tone(260, 0.2, { gain: 0.08, slide: 180 }); },
  rewind() { this.tone(700, 0.26, { gain: 0.06, slide: 360 }); },
  win() {
    [523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) => this.tone(f, 0.38, { type: 'triangle', gain: 0.075, when: i * 0.09 }));
    [2093, 2637, 3136, 4186].forEach((f, i) => this.tone(f, 0.12, { gain: 0.025, when: 0.52 + i * 0.06 }));
  }
};

/* ---------------- recorded voice: the letter names and words from حروفي ---------------- */
const Voice = {
  cache: {}, cur: null, token: 0,
  has(key) { return Object.prototype.hasOwnProperty.call(VOICE, key); },
  decode(key) {
    if (!this.cache[key]) {
      this.cache[key] = new Promise((res, rej) => {
        const bin = atob(VOICE[key]), bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        Sound.ctx.decodeAudioData(bytes.buffer, res, rej);
      });
      this.cache[key].catch(() => { delete this.cache[key]; });
    }
    return this.cache[key];
  },
  stop() { this.token++; if (this.cur) { try { this.cur.stop(); } catch (e) {} this.cur = null; } },
  async play(keys) {
    if (!store.sound || !Sound.ctx) return;
    this.stop();
    const tok = this.token;
    for (const k of keys) {
      if (!this.has(k)) continue;
      let buf;
      try { buf = await this.decode(k); } catch (e) { continue; }
      if (tok !== this.token) return;
      await new Promise(res => {
        const src = Sound.ctx.createBufferSource();
        src.buffer = buf; src.connect(Sound.ctx.destination);
        src.onended = res; this.cur = src; src.start();
      });
      if (tok !== this.token) return;
      await sleep(280);
    }
  }
};

/* ---------------- sparkles and confetti ---------------- */
const FX = {
  cv: $('fx'), ctx: null, parts: [], running: false, dpr: 1, last: 0,
  init() { this.ctx = this.cv.getContext('2d'); this.resize(); addEventListener('resize', () => this.resize()); },
  resize() {
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.cv.width = Math.round(innerWidth * this.dpr); this.cv.height = Math.round(innerHeight * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  },
  add(p) { this.parts.push(p); if (!this.running) { this.running = true; this.last = performance.now(); requestAnimationFrame(t => this.loop(t)); } },
  sparkle(x, y, color) {
    if (!moving()) return;
    for (let k = 0; k < 2; k++) this.add({ x, y, vx: (Math.random() - .5) * 3.4, vy: -Math.random() * 2.6 - .4, g: .06, life: 1, decay: .03 + Math.random() * .02,
      size: 4 + Math.random() * 5, color: Math.random() < .45 ? '#FFB400' : color, shape: 'star', rot: Math.random() * 6.3, vr: (Math.random() - .5) * .3 });
  },
  burst(x, y, n, colors) {
    if (!moving()) return;
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 9;
      this.add({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 5, g: .28, life: 1, decay: .007 + Math.random() * .008,
        size: 6 + Math.random() * 8, color: pick(colors), shape: pick(['rect', 'rect', 'circle', 'star']), rot: Math.random() * 6.3, vr: (Math.random() - .5) * .35 });
    }
  },
  clear() { this.parts = []; },
  loop(t) {
    const dt = Math.min(2.5, (t - this.last) / 16.67); this.last = t;
    const c = this.ctx; c.clearRect(0, 0, innerWidth, innerHeight);
    this.parts = this.parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
    for (const p of this.parts) {
      p.vy += p.g * dt; p.vx *= Math.pow(.99, dt); p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= p.decay * dt;
      c.save(); c.globalAlpha = Math.max(0, Math.min(1, p.life * 1.6)); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.color;
      if (p.shape === 'rect') c.fillRect(-p.size / 2, -p.size / 3.2, p.size, p.size / 1.6);
      else if (p.shape === 'circle') { c.beginPath(); c.arc(0, 0, p.size / 2.4, 0, 6.2832); c.fill(); }
      else { c.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? p.size * .22 : p.size * .55; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath(); c.fill(); }
      c.restore();
    }
    if (this.parts.length) requestAnimationFrame(tt => this.loop(tt)); else { this.running = false; c.clearRect(0, 0, innerWidth, innerHeight); }
  }
};

/* ---------------- pictures as SVG ---------------- */
let maskN = 0;
function picInner(pic, lw, glints) {
  let s = '';
  if (pic.bub) {
    const id = 'bm' + (++maskN), b = pic.bub;
    const thick = b.paths.map(p => `<path d="${p.d}" stroke-width="${p.w + lw}"/>`).join('') + b.dots.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r + lw / 2}" stroke="none" fill="#fff"/>`).join('');
    const thin = b.paths.map(p => `<path d="${p.d}" stroke-width="${Math.max(1, p.w - lw)}"/>`).join('') + b.dots.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${Math.max(.5, r - lw / 2)}" stroke="none" fill="#000"/>`).join('');
    s += `<defs><mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="400"><g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">${thick}</g><g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">${thin}</g></mask></defs><rect width="400" height="400" fill="currentColor" mask="url(#${id})"/>`;
  }
  for (const el of pic.lines || []) {
    if (el.hid) continue;
    if (el.d) s += `<path class="ln" d="${el.d}" stroke-width="${(el.w || LW) * lw / LW}"/>`;
    else if (el.c) {
      const [x, y, r] = el.c;
      s += `<circle class="dt" cx="${x}" cy="${y}" r="${r + (lw - LW) / 2}"/>`;
      if (glints && el.eye) s += `<circle class="gl" cx="${(x - r * .32).toFixed(1)}" cy="${(y - r * .32).toFixed(1)}" r="${(r * .34).toFixed(1)}"/>`;
    }
  }
  return s;
}
const picSVG = (pic, lw = 12) => `<svg viewBox="0 0 400 400" aria-hidden="true">${picInner(pic, lw, false).replace(/class="ln"/g, 'class="ln" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"').replace(/class="dt"/g, 'class="dt" fill="currentColor"')}</svg>`;
function drawSVG(sub, lw = 12, upto = 99, cls = '') {
  let s = '';
  sub.steps.forEach((st, i) => {
    if (i > upto) return;
    const now = i === upto ? ' now' : '';
    for (const d of st.d) s += `<path class="ln${now}" d="${d}" stroke-width="${lw}"${cls ? '' : ' stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"'}/>`;
    for (const [x, y] of st.dots) s += `<circle class="dt${now}" cx="${x}" cy="${y}" r="${lw * .9}"${cls ? '' : ' fill="currentColor"'}/>`;
  });
  return `<svg viewBox="0 0 400 400" aria-hidden="true">${s}</svg>`;
}

function noise(n, cell) {

}
const PAT = {};
function makePatterns(ctx) {
  // wax crayon: solid colour with the paper's tooth showing through
  let n = 192, c = ENG.canvas(n, n), x = c.getContext('2d'), im = x.createImageData(n, n), d = im.data;
  const a1 = noise(n, 6), a2 = noise(n, 16), a3 = noise(n, 48);
  for (let y = 0; y < n; y++) for (let i = 0; i < n; i++) {
    const v = .45 * a1(i, y) + .3 * a2(i, y) + .15 * a3(i, y) + .1 * Math.random();
    const o = (y * n + i) * 4; d[o + 3] = v > .36 ? 255 : Math.max(0, Math.round(255 * (v - .16) / .2));

  n = 256; c = ENG.canvas(n, n); x = c.getContext('2d'); im = x.createImageData(n, n); d = im.data;
  const b1 = noise(n, 40), b2 = noise(n, 12);

    const v = .7 * b1(i, y) + .3 * b2(i, y);
    d[(y * n + i) * 4 + 3] = Math.round(170 + 85 * v);

const Local = {

        r.onsuccess = () => { this.db = r.result; res(); };

  },

    for (const l of this.local) if (!seen.has(l.id)) { seen.add(l.id); out.push(l); }

  },
  async init() {

    if (!C || typeof C.use !== 'function') return;
    C.use('downloads').then(d => { this.downloads = d; }).catch(() => {});
    try {
      const [db, user, assets] = await Promise.all(['db', 'user', 'assets'].map(n => C.use(n).catch(() => null)));
      if (!db || !user || !assets) return;

      }

  listen() {

  },
  url(item) {

  S.artId = id; S.dirty = false;
  const big = composite(RES, true), small = composite(360, false), thumb = small.toDataURL('image/jpeg', .8);
  small.width = small.height = 0;
  const kind = S.mode === 'number' ? 'number' : S.pic.draw ? 'draw' : 'colour';
  const meta = { id, kind, ref: kind === 'number' ? S.page.id : kind === 'draw' ? S.pic.draw : S.pic.id, name: S.mode === 'number' ? S.page.name : S.pic.name,
                 t: Date.now(), alive: S.pic.alive || 'bounce', eyes: eyesOf(S.pic) };
  if (kind === 'draw') meta.ink = S.pic.lines.map(l => l.c ? { c: l.c, eye: l.eye || 0 } : l.hid ? { d: l.d, hid: 1 } : { d: l.d });
  if (kind === 'number') { meta.done = S.seeds.map(s => !!s.done); meta.fin = S.seeds.every(s => s.done); }
  else meta.fin = !!(extra.fin || S.fin);
  if (extra.fin) S.fin = true;
  const job = async () => { const blob = await toBlob(big, .9); big.width = big.height = 0; return blob ? await Store.put(meta, blob, thumb) : null; };
  S.saving = (S.saving || Promise.resolve()).then(job, job).catch(() => null);
  return S.saving;
}
function backFromPaint() {
  if (S.from === 'gallery') openGallery();
  else if (S.mode === 'draw' || (S.pic && S.pic.draw)) openShelf('draw');
  else if (S.mode === 'number') openShelf('number');
  else openShelf('colour', S.pic && S.pic.g);
}
function leavePaint(next) {
  finishFills(); stopAlive(); Voice.stop(); Draw.stopDemo();
  if (S.st) { S.pid = null; endStroke(); }
  saveArt();
  next();
}
$('paintBack').addEventListener('click', () => { Sound.tap(); leavePaint(backFromPaint); });
$('undoBtn').addEventListener('click', () => { if (!S.lock) undo(); });
$('clearBtn').addEventListener('click', () => {
  if (S.lock) return;
  Sound.tap();
  if (S.mode === 'draw') { Draw.clearStep(); return; }
  finishFills();
  const all = grab(P, [0, 0, RES, RES]);
  pushUndo(all, [0, 0, RES, RES], S.mode === 'number' ? { done: S.seeds.map(s => s.done) } : null);
  P.clearRect(0, 0, RES, RES);
  if (S.mode === 'number') { S.seeds.forEach(s => { s.done = false; s.el && s.el.classList.remove('done'); }); if (S.R) bindSeeds(); progress(); }
  Sound.rewind(); changed();
});
$('doneBtn').addEventListener('click', () => { Sound.unlock(); if (S.mode === 'colour' && !S.lock) celebrate('colour'); });
$('sayBtn').addEventListener('click', () => { Sound.unlock(); if (S.pic && S.pic.voice) Voice.play(S.pic.voice); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && S.screen === 'paint' && S.dirty) saveArt(); });

/* ---------------- gallery ---------------- */
const fmtDate = t => { try { return ar(new Date(t).toLocaleDateString('ar', { day: 'numeric', month: 'long' })); } catch (e) { return ''; } };
function openGallery() {
  const sc = SECT.gallery, head = $('galHead');
  head.style.setProperty('--c', sc.c); head.style.setProperty('--t', sc.t);
  $('galIcon').innerHTML = ART.gallery;
  renderGallery();
  showScreen('gal');
}
function renderGallery() {
  const items = Store.items;
  $('galCount').textContent = items.length ? `${ar(items.length)} ${items.length > 10 || items.length < 3 ? 'رسمة' : 'رسمات'}` : '';
  $('frames').innerHTML = items.map((it, i) => {
    const [a] = TINTS[i % TINTS.length];
    return `<button class="frame" type="button" data-id="${esc(it.id)}" style="box-shadow:var(--shadow),inset 0 0 0 3px ${a}22"><img src="${esc(it.thumb)}" alt="${esc(it.name)}" loading="lazy"><span class="nm"><span>${esc(it.name)}</span><small>${fmtDate(it.t)}</small></span></button>`;
  }).join('');
  const empty = $('galEmpty');
  empty.hidden = !!items.length;
  if (!items.length) empty.innerHTML = `${ART.gallery}<b>${Store.loading ? 'نحضر رسوماتك…' : 'رسوماتك ستظهر هنا'}</b><p>${Store.loading ? '' : 'لوّني صورة ثم اضغطي «انتهيت»، وتُحفظ هنا وحدها.'}</p>`;
  $('galNote').innerHTML = Store.mode === 'local' && !Store.loading
    ? `<div class="note"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M10 18h4"/></svg>${Local.db ? 'الرسومات محفوظة على هذا الجهاز فقط.' : 'هذا المتصفح لا يسمح بالحفظ هنا، فالرسومات تبقى حتى تُغلق الصفحة.'}</div>` : '';
}
$('frames').addEventListener('click', e => {
  const f = e.target.closest('.frame'); if (!f) return;
  Sound.tap(); const it = Store.items.find(x => x.id === f.dataset.id); if (it) openViewer(it);
});
$('galBack').addEventListener('click', () => { Sound.tap(); openHub(); });
Store.on(() => {
  if (S.screen === 'gal') renderGallery();
  if (S.screen === 'hub') renderHub();
  if (S.screen === 'shelfS') renderTiles();
  if (V.item && !Store.items.some(x => x.id === V.item.id)) closeViewer();
  $('setFoot').textContent = Store.mode === 'cloud' ? 'الرسومات محفوظة في حسابك، وتظهر على أي جهاز تفتح منه ألواني.' : Local.db ? 'الرسومات محفوظة على هذا الجهاز.' : 'الرسومات تبقى حتى تُغلق الصفحة.';
});

/* viewer */
const V = { item: null };
function openViewer(it) {
  V.item = it;
  $('vName').textContent = it.name; $('vDate').textContent = fmtDate(it.t);
  const img = $('vImg'); img.src = it.thumb; img.alt = it.name;
  const full = Store.url(it);
  if (full && full !== it.thumb) { const im = new Image(); im.onload = () => { if (V.item === it) img.src = full; }; im.src = full; }
  $('vConfirm').hidden = true; $('vActs').hidden = false;
  $('vSave').hidden = !Store.downloads; $('vTip').hidden = !!Store.downloads;
  $('viewer').hidden = false;
}
function closeViewer() { V.item = null; $('viewer').hidden = true; $('vLids').textContent = ''; }
$('vClose').addEventListener('click', () => { Sound.tap(); closeViewer(); });
$('viewer').addEventListener('click', e => { if (e.target === $('viewer')) closeViewer(); });
$('vPlay').addEventListener('click', async () => {
  const it = V.item; if (!it) return;
  Sound.unlock();
  let sample = null;
  try {
    const c = ENG.canvas(400, 400), x = c.getContext('2d'); x.drawImage($('vImg'), 0, 0, 400, 400);
    const d = x.getImageData(0, 0, 400, 400).data;
    sample = (px, py) => { const i = (Math.max(0, Math.min(399, py | 0)) * 400 + Math.max(0, Math.min(399, px | 0))) * 4; return [d[i], d[i + 1], d[i + 2], 255]; };
  } catch (e) {}
  Sound.win();
  const r = $('vPic').getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top + r.height * .4, 70, PALETTE.slice(0, 11));
  await playAlive($('vImg'), it.alive, sample ? $('vLids') : null, it.eyes, sample);
});
$('vMore').addEventListener('click', async () => {
  const it = V.item; if (!it) return;
  Sound.unlock(); Sound.tap();
  let bmp = null;
  try { bmp = await loadBitmap(await Store.blob(it)); } catch (e) { try { bmp = await loadBitmap(await (await fetch(it.thumb)).blob()); } catch (e2) {} }
  closeViewer();
  if (it.kind === 'number' && NUM[it.ref]) {
    const pg = NUM[it.ref];
    openPaint({ mode: it.fin ? 'colour' : 'number', page: pg, pic: PIC[pg.pic], base: bmp, art: it, done: it.done, from: 'gallery' });
    if (it.fin) { S.page = pg; }
  } else if (it.kind === 'draw' && it.ink) {
    const sub = DRAW[it.ref] || { name: it.name, alive: it.alive };
    const pic = { id: 'draw-' + it.id, name: it.name, lines: it.ink.map(l => l.c ? { c: l.c, eye: l.eye } : { d: l.d, w: 6, hid: l.hid || 0 }), close: 5, alive: it.alive || sub.alive, draw: it.ref };
    openPaint({ mode: 'colour', pic, base: bmp, art: it, from: 'gallery' });
  } else if (PIC[it.ref]) {
    openPaint({ mode: 'colour', pic: PIC[it.ref], base: bmp, art: it, from: 'gallery' });
  } else toast('ما قدرنا نفتح هذه الرسمة');
});
$('vSave').addEventListener('click', async () => {
  const it = V.item; if (!it || !Store.downloads) return;
  Sound.tap();
  try {
    const blob = await Store.blob(it);
    await Store.downloads.save({ filename: `ألواني - ${it.name}.jpg`, data: blob });
  } catch (e) {
    if (e && e.code === 'declined') return;
    if (e && (e.code === 'unavailable' || e.code === 'not_granted' || e.code === 'capability_disabled' || e.code === 'capability_removed')) { $('vSave').hidden = true; $('vTip').hidden = false; }
    else toast('ما قدرنا نحفظ الصورة الآن');
  }
});
$('vDel').addEventListener('click', () => { Sound.tap(); $('vActs').hidden = true; $('vConfirm').hidden = false; });
$('vDelNo').addEventListener('click', () => { Sound.tap(); $('vActs').hidden = false; $('vConfirm').hidden = true; });
$('vDelYes').addEventListener('click', async () => {
  const it = V.item; if (!it) return;
  Sound.rewind(); closeViewer();
  await Store.remove(it);
});

/* ---------------- settings ---------------- */
function syncSeg() {
  document.querySelectorAll('.seg').forEach(seg => {
    const v = store[seg.dataset.key] ? '1' : '0';
    seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  });
}
$('setBtn').addEventListener('click', () => { Sound.unlock(); Sound.tap(); syncSeg(); $('settings').hidden = false; });
$('setClose').addEventListener('click', () => { $('settings').hidden = true; });
$('settings').addEventListener('click', e => {
  if (e.target === $('settings')) { $('settings').hidden = true; return; }
  const b = e.target.closest('.seg button'); if (!b) return;
  store[b.closest('.seg').dataset.key] = b.dataset.v === '1';
  syncSeg(); applyCalm(); Sound.tap();
});
addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('viewer').hidden) closeViewer(); else if (!$('settings').hidden) $('settings').hidden = true; }
  if ((e.metaKey || e.ctrlKey) && e.key === 'z' && S.screen === 'paint') { e.preventDefault(); undo(); }
});
reduced.addEventListener && reduced.addEventListener('change', applyCalm);

/* ---------------- start ---------------- */
FX.init(); makePatterns(P); applyCalm(); buildHub(); openHub();
Store.init();
})();

</script>
